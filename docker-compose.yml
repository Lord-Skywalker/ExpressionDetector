version: '3.8'

services:
  db:
    image: postgres:15
    container_name: analytics_db
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: analytics_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
