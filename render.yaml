# render.yaml — Render.com deployment configuration
# Defines the Django API web service and Celery background worker.
# Deploy by connecting your GitHub repo to Render and pointing it at this file.

envVarGroups:
  - name: shared-django-env
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: ML_WORKER_URL
        value: https://expressiondetector-ml-4qcqiendnq-uc.a.run.app

services:
  # ── Django REST API ────────────────────────────────────────────────────────
  - type: web
    name: expressiondetector-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-prod.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - fromGroup: shared-django-env
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "expressiondetector-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: expressiondetector-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set to your Vercel frontend URL
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: expressiondetector-db
    plan: free
    region: oregon
